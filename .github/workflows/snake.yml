name: Generate contribution snake

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Set animation to a five-minute cycle
        shell: python
        run: |
          from pathlib import Path
          import re

          duration_pattern = re.compile(r"(\d+)ms")
          svg_paths = sorted(Path("dist").glob("*.svg"))
          target_duration_ms = 5 * 60 * 1000

          if not svg_paths:
              raise RuntimeError("No generated SVG files found")

          for svg_path in svg_paths:
              source = svg_path.read_text()
              slowed, replacements = duration_pattern.subn(
                  f"{target_duration_ms}ms",
                  source,
              )

              if replacements == 0:
                  raise RuntimeError(f"No animation durations found in {svg_path}")

              svg_path.write_text(slowed)
              print(f"Slowed {replacements} durations in {svg_path}")

      - name: Publish contribution snake to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update contribution snake"
          git branch -M output
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
